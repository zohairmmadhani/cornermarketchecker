name: Deploy Open Territory to GitHub Pages

# Publishes the static site in web/ to GitHub Pages on every push to main.
# Two-job structure (build then deploy) is GitHub's recommended pattern: the
# build job fully finalizes the Pages artifact before the deploy job starts,
# which avoids the "No artifacts named github-pages" upload/deploy race.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
